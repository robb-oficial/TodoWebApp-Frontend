<form [formGroup]="loginForm" class="form" (ngSubmit)="onSubmit()">
    <h2 class="form__h2">Login</h2>

    <mat-form-field class="form-control">
        <mat-label>Username</mat-label>
        <input matInput type="text" placeholder="john123" formControlName="username">
    </mat-form-field>
    <mat-form-field class="form-control">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password">
    </mat-form-field>

    <button matButton="elevated" type="submit" class="btn">Submit</button>
    @if (errorMessage(); as err) {
    <p class="error-message">{{err}}</p>
    }
</form>
